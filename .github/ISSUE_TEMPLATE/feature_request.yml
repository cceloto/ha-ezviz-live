name: Feature request
description: Suggest a new feature or a change in behavior
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: English or Portuguese are both fine.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: input
    id: devices
    attributes:
      label: Devices involved
      description: Model numbers, if the feature depends on the device.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I can test a development version with my device.
